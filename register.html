<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PC Full - Crear usuario</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="register-container">
    <div class="register-card">
      <div class="register-logo">
        <span style="font-size: 3rem;">💻</span>
        <h2>PC Full - Crear Usuario</h2>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label for="run">RUN</label>
          <input type="text" id="run" name="run" required minlength="7" maxlength="9" placeholder="Ej: 19011022K">
        </div>

        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required maxlength="50">
        </div>

        <div class="form-group">
          <label for="apellido">Apellidos</label>
          <input type="text" id="apellido" name="apellido" required maxlength="100">
        </div>

        <div class="form-group">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" required maxlength="100" placeholder="ejemplo@gmail.com">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required minlength="6">
        </div>

        <button type="submit" class="btn_register">Registrarse</button>
      </form>
    </div>
  </div>

  <script src="js/validacionRUT.js"></script>
</body>
</html>
