<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Full - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <span style="font-size: 6rem;">💻</span>
                <h2>PC Full - Iniciar Sesión</h2>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario:</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="role">Tipo de acceso:</label>
                    <select id="role" name="role" required>
                        <option value="">Seleccionar tipo...</option>
                        <option value="admin">Administrador</option>
                        <option value="ventas">Equipo de Ventas</option>
                        <option value="client">Cliente</option>
                    </select>
                </div>

                <button type="submit" class="btn-login">Ingresar al Sistema</button>
            </form>

            <div class="login-links">
                <p><a href="client.html">Volver al sitio público</a></p>
                <p>¿Problemas de acceso? <a href="#" onclick="limpiarSesionCompleta(); alert('Sesión limpiada. Intenta iniciar sesión nuevamente.');">Limpiar sesión</a></p>
            </div>
        </div>
    </div>

    
    <script src="js/login.js"></script>
</body>
</html>
